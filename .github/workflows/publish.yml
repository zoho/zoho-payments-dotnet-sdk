name: Build and Publish NuGet Package

on:
  release:
    types:
      - published

  workflow_dispatch:

jobs:

  build-and-publish:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/ZohoPayments/ZohoPayments.csproj

      - name: Build
        run: dotnet build src/ZohoPayments/ZohoPayments.csproj --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/ZohoPayments/ZohoPayments.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkg

      - name: Publish to NuGet
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
